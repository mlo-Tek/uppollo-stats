name: Build and publish Docker image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/mlo-tek/uppollo-stats:latest
            ghcr.io/mlo-tek/uppollo-stats:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/mlo-Tek/uppollo-stats
            org.opencontainers.image.description=Private Unraid dashboard for qBittorrent to upPollo upload statistics
